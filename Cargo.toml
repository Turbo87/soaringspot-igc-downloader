[package]
name = "soaringspot-igc-downloader"
description = "Downloads IGC files from SoaringSpot competition results"
license = "MIT OR Apache-2.0"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
html-escape = "=0.3.0"
indicatif = "=0.18.6"
jiff = "=0.2.38"
reqwest = { version = "=0.12.20", features = ["json"] }
scraper = "=0.23.1"
tempfile = "=3.20.0"
tokio = { version = "=1.54.1", features = ["full"] }
url = "=2.5.8"

[dev-dependencies]
insta = "=1.49.0"
